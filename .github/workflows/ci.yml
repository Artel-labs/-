name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci
      SITE_MODE: test
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: sudo apt-get install -y -q gettext && msgfmt --check -o /dev/null backend/locale/ru/LC_MESSAGES/django.po
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -P SCRIPTDIR scripts/*.sh deploy/entrypoint.sh

  install:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@v7
      - name: Порты 80 и 443 заняты другим сайтом
        run: |
          sudo nohup python3 -m http.server 80 >/dev/null 2>&1 &
          sudo nohup python3 -m http.server 443 >/dev/null 2>&1 &
          sleep 1
      - name: Установка одной командой без параметров
        run: |
          set -o pipefail
          sudo ./scripts/install.sh | tee install.log
      - name: Администратор создан, порты выбраны автоматически
        run: |
          grep -q "^Логин:  admin" install.log
          grep -q "^HTTPS_PORT=8443" .env
      - run: curl -fsSk https://127.0.0.1:8443/api/health
      - name: Каталог заполнен начальными данными
        run: |
          count="$(sudo docker compose exec -T app python manage.py shell -c 'from catalog.models import Program; print(Program.objects.count())' | tail -n 1)"
          test "$count" = "34"
          curl -fsSk -o /dev/null https://127.0.0.1:8443/media/programs/816497962.jpg
          curl -fsSk -o /dev/null https://127.0.0.1:8443/media/files/816497962-plan.pdf
      - name: Главная собирается из каталога
        run: |
          page="$(curl -fsSk https://127.0.0.1:8443/)"
          grep -q "Повышение квалификации и&nbsp;переподготовка юристов" <<< "$page"
          test "$(grep -o 'class="dpo-teacher"' <<< "$page" | wc -l)" -gt 0
          test "$(grep -c 'navProgramsBtn' <<< "$page")" = "0"
          grep -q 'id="cookieBanner"' <<< "$page"
          grep -q 'id="channelInvite"' <<< "$page"
      - name: Страница программы собирается из базы
        run: |
          page="https://127.0.0.1:8443/programs/angliyskoe-kontraktnoe-pravo-856421092.html"
          curl -fsSk "$page" | grep -q "<h1>Английское контрактное право</h1>"
          curl -fsSk "$page" | grep -q 'rel="canonical" href="https://[^"]*/programs/angliyskoe-kontraktnoe-pravo-856421092.html"'
          curl -fsSk -o /dev/null https://127.0.0.1:8443/media/programs/thumbs/856421092.webp
      - name: Каталог показывает все программы, старые адреса перенаправляются
        run: |
          test "$(curl -fsSk https://127.0.0.1:8443/catalog | grep -o 'class="card"' | wc -l)" = "34"
          curl -sSkI "https://127.0.0.1:8443/%D0%9A%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3%20%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC.html?sphere=digital" | grep -qi "^location: .*/catalog?sphere=digital"
          curl -sSkI https://127.0.0.1:8443/catalog.html | grep -qi "^location: .*/catalog"
      - name: Рейтинги, политика, карта сайта и robots.txt
        run: |
          curl -fsSk https://127.0.0.1:8443/ratings | grep -q "<h1>Позиции НИУ ВШЭ в&nbsp;рейтингах</h1>"
          curl -fsSk https://127.0.0.1:8443/privacy | grep -q "<h1>Политика обработки персональных данных</h1>"
          curl -fsSk https://127.0.0.1:8443/consent | grep -q "<h1>Согласие на обработку персональных данных</h1>"
          curl -fsSk https://127.0.0.1:8443/consent | grep -q "https://www.hse.ru/appeal/polls/575012041.html"
          curl -fsSk https://127.0.0.1:8443/ads-consent | grep -q "<h1>Согласие на получение рассылок</h1>"
          for page in / /catalog /ratings /no-such-page; do
            curl -sSk "https://127.0.0.1:8443$page" | grep -q 'href="https://www.hse.ru/data_protection_regulation" target="_blank" rel="noopener"'
          done
          test "$(curl -fsSk https://127.0.0.1:8443/sitemap.xml | grep -c '<url>')" = "38"
          curl -fsSk https://127.0.0.1:8443/robots.txt | grep -q "^Sitemap: https://.*/sitemap.xml$"
          curl -sSkI https://127.0.0.1:8443/ratings.html | grep -qi "^location: /ratings"
          curl -sSkI https://127.0.0.1:8443/privacy.html | grep -qi "^location: /privacy"
          test "$(curl -sSk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/no-such-page)" = "404"
          curl -sSk https://127.0.0.1:8443/no-such-page | grep -q "Такой страницы нет"
      - name: Знак ВШЭ в шапке каждой страницы
        run: |
          for page in / /catalog /programs/angliyskoe-kontraktnoe-pravo-856421092.html /ratings /privacy; do
            curl -fsSk "https://127.0.0.1:8443$page" | grep -q 'class="hse-lockup"'
          done
          curl -sSk https://127.0.0.1:8443/no-such-page | grep -q 'class="hse-lockup"'
          curl -fsSk -o /dev/null https://127.0.0.1:8443/images/logo/hse-mark.svg
      - name: Каталог для бота поддержки
        run: |
          count="$(curl -fsSk https://127.0.0.1:8443/api/catalog/bot | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')"
          test "$count" = "34"
      - name: События посещаемости принимаются
        run: |
          code="$(curl -sSk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"events":[{"type":"pageview","sid":"ci-session-1","path":"/","device":"desktop"}]}' https://127.0.0.1:8443/api/collect)"
          test "$code" = "204"
          count="$(sudo docker compose exec -T app python manage.py shell -c 'from analytics.models import Event; print(Event.objects.count())' | tail -n 1)"
          test "$count" = "1"
      - name: Демо Telegram закрыто на боевом сервере
        run: test "$(curl -sSk -o /dev/null -w '%{http_code}' 'https://127.0.0.1:8443/tg/?mode=production')" = "404"
      - name: Мини-приложение Telegram в тестовом режиме
        run: |
          sudo sed -i 's/^SITE_MODE=.*/SITE_MODE=test/' .env
          sudo docker compose up -d site
          for attempt in $(seq 1 30); do curl -fsSk -o /dev/null https://127.0.0.1:8443/tg/ && break; sleep 2; done
          curl -fsSk https://127.0.0.1:8443/tg/ | grep -q 'id="tg-data"'
          curl -sSkI https://127.0.0.1:8443/tg/ | grep -qi "^content-security-policy: .*script-src 'self' https://telegram.org"
          count="$(curl -fsSk https://127.0.0.1:8443/api/catalog/tg | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["programs"]))')"
          test "$count" = "34"
          sudo sed -i 's/^SITE_MODE=.*/SITE_MODE=production/' .env
          sudo docker compose up -d site
      - name: Заявка принимается и видна в базе
        run: |
          code="$(curl -sSk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"firstName":"Проверка","lastName":"CI","phone":"+7 495 000 00 00","email":"ci@example.ru","consent":true}' https://127.0.0.1:8443/api/applications)"
          test "$code" = "200"
          count="$(sudo docker compose exec -T app python manage.py shell -c 'from applications.models import Application; print(Application.objects.count())' | tail -n 1)"
          test "$count" = "1"
      - name: Старый адрес программы перенаправляется, неизвестная даёт 404
        run: |
          curl -sSkI https://127.0.0.1:8443/programs/old-title-856421092.html | grep -qi "^location: .*/programs/angliyskoe-kontraktnoe-pravo-856421092.html"
          test "$(curl -sSk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/programs/unknown-1.html)" = "404"
      - run: curl -fsSk -o /dev/null https://127.0.0.1:8443/admin/login/
      - name: HTTP перенаправляет на HTTPS с нужным портом
        run: |
          curl -sI http://127.0.0.1:8080/ | grep -qi "^location: https://127.0.0.1:8443/"
      - name: Адрес без https на HTTPS-порту тоже перенаправляется
        run: |
          curl -sI http://127.0.0.1:8443/ | grep -qi "^location: https://127.0.0.1:8443/"
      - run: sudo ./scripts/create-admin.sh | grep -q "уже есть"
      - run: sudo ./scripts/disable-two-factor.sh admin | grep -q "не был включён"
      - run: 'sudo ./scripts/reset-admin-password.sh | grep -q "^Логин:  admin$"'
      - name: В копию попадает заявка с истёкшим сроком хранения
        run: |
          sudo docker compose exec -T app python manage.py shell -c 'from datetime import timedelta; from django.utils import timezone; from applications.models import Application; a = Application.objects.create(topic="feedback", comment="ci-expired"); Application.objects.filter(pk=a.pk).update(received_at=timezone.now() - timedelta(days=400))'
      - name: Копия старше 30 дней лежит в папке копий
        run: |
          sudo mkdir -p /var/backups/dpo
          sudo touch -d '31 days ago' /var/backups/dpo/dpo-20000101-000000.sql.gz /var/backups/dpo/dpo-20000101-000000.media.tar.gz
      - run: sudo ./scripts/backup.sh
      - name: Копия старше 30 дней удалена
        run: test -z "$(sudo find /var/backups/dpo -name 'dpo-20000101-*')"
      - run: sudo ./scripts/rotate-logs.sh --now | grep -q "пересозданы"
      - run: test -z "$(sudo ./scripts/rotate-logs.sh)"
      - name: Восстановление из последней копии
        run: |
          latest="$(sudo find /var/backups/dpo -name 'dpo-*.sql.gz' -printf '%T@ %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)"
          sudo ./scripts/restore.sh "$latest" --yes
      - name: Восстановление не возвращает заявку с истёкшим сроком
        run: |
          count="$(sudo docker compose exec -T app python manage.py shell -c 'from applications.models import Application; print(Application.objects.filter(comment="ci-expired").count())' | tail -n 1)"
          test "$count" = "0"
      - run: curl -fsSk https://127.0.0.1:8443/api/health
      - name: Установка с HTTPS включает боевой режим
        run: sudo grep -qx "SITE_MODE=production" .env
      - name: Боевой режим не запускается с почтой без шифрования
        run: |
          sudo sh -c 'echo SMTP_ALLOW_INSECURE_AUTH=1 >> .env'
          ! sudo docker compose run --rm -T app python manage.py check > check.log 2>&1
          grep -q "SMTP_ALLOW_INSECURE_AUTH=1 запрещён" check.log
          sudo sed -i '/^SMTP_ALLOW_INSECURE_AUTH=/d' .env
          sudo docker compose run --rm -T app python manage.py check
      - name: Пароль root не попадает в лог базы
        run: |
          ! sudo docker compose logs db | grep -q "GENERATED ROOT PASSWORD"
      - if: failure()
        run: docker compose logs --tail=100
