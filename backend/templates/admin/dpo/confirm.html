{% extends "admin/base_site.html" %}

{% block content %}
    <section class="dpo-panel">
        <h2 class="dpo-panel-title">{{ step.title }}</h2>
        <p class="dpo-panel-lead">{{ subject.label }}: <b>{{ subject.name }}</b></p>
        <p>{{ step.text }}</p>
        <form method="post" class="dpo-panel-actions">
            {% csrf_token %}
            <button type="submit" class="dpo-button{% if step.danger %} dpo-button-danger{% endif %}">{{ step.button }}</button>
            <a class="dpo-button dpo-button-quiet" href="{{ back_url }}">Отмена</a>
        </form>
    </section>
{% endblock %}
