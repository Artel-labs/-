name: dpo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: mariadb:11.8.9
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME}
      MARIADB_USER: ${DB_USER:?DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: dpo-app
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: dpo-app
    pull_policy: never
    command: ["python", "manage.py", "qcluster"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - media:/app/media
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - app
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_DIR:-/etc/dpo/tls}:/etc/nginx/tls:ro
      - media:/usr/share/nginx/media:ro
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  db-data:
  media:
