root /usr/share/nginx/html;
client_max_body_size 1m;
set $app http://app:8000;
set $site http://site:4321;

error_page 404 /404.html;

location = /404.html {
    internal;
    include /etc/nginx/snippets/site-headers.conf;
}

location = /catalog.html {
    return 301 /catalog$is_args$args;
}

location = "/Каталог программ.html" {
    return 301 /catalog$is_args$args;
}

location = /index.html {
    return 301 /$is_args$args;
}

location = /privacy.html {
    return 301 /privacy$is_args$args;
}

location = /ratings.html {
    return 301 /ratings$is_args$args;
}

location ^~ /admin/login/ {
    set $upstream $app;
    limit_req zone=admin_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/admin-headers.conf;
}

location /admin/ {
    set $upstream $app;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/admin-headers.conf;
}

location ~* ^/media/.+\.(jpe?g|png|webp|pdf)$ {
    root /usr/share/nginx;
    include /etc/nginx/snippets/site-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
}

location /media/ {
    return 404;
}

location /static/ {
    set $upstream $app;
    include /etc/nginx/snippets/proxy.conf;
}

location = /api/applications {
    set $upstream $app;
    limit_except POST {
        deny all;
    }
    limit_req zone=applications burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    include /etc/nginx/snippets/proxy.conf;
    add_header Cache-Control "no-store" always;
}

location = /api/collect {
    set $upstream $app;
    limit_except POST {
        deny all;
    }
    limit_req zone=collect burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/proxy.conf;
    add_header Cache-Control "no-store" always;
}

location /api/ {
    set $upstream $app;
    include /etc/nginx/snippets/proxy.conf;
    add_header Cache-Control "no-store" always;
}

location /_astro/ {
    include /etc/nginx/snippets/site-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/(fonts|images)/ {
    include /etc/nginx/snippets/site-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}

location / {
    try_files $uri @site;
    include /etc/nginx/snippets/site-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/tg/?$ {
    set $upstream $site;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/site-cache.conf;
    include /etc/nginx/snippets/tg-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location @site {
    set $upstream $site;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/site-cache.conf;
    include /etc/nginx/snippets/site-headers.conf;
    add_header Cache-Control "no-cache" always;
}
