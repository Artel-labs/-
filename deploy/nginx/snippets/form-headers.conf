add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://www.hse.ru/n/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' https://www.hse.ru/n/; img-src 'self' data: https://www.hse.ru https://pravo.hse.ru; font-src 'self' https://www.hse.ru/n/; connect-src 'self' https://www.hse.ru/n/; frame-src https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
