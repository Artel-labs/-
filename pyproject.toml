[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DJ", "RUF", "N", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend"]
exclude = ["backend/.*/migrations/"]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["axes.*", "unfold.*", "django_q.*", "json5"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["accounts.admin", "accounts.staff_admin", "accounts.forms", "applications.admin", "analytics.admin", "catalog.admin", "core.admin", "accounts.login_protection", "accounts.login_views", "accounts.sites"]
disallow_subclassing_any = false
disable_error_code = ["type-arg", "untyped-decorator", "import-untyped"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
